<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>ท้องฟ้า 3D 10 วินาที</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--blue:#2346c8;--teal:#14a3a8;--green:#3aa564;--tea:#f28a2a;--ink:#14213d;--bg:#f4f1ea}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:var(--bg);font-family:"Kanit",sans-serif;color:var(--ink)}
#c{position:absolute;inset:0;width:1080px;height:1080px;display:block}
.card{position:absolute;left:44px;top:44px;width:388px;padding:22px 24px 20px;border-radius:26px;background:rgba(255,255,255,.52);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 50px rgba(20,33,61,.16),inset 0 1px 0 rgba(255,255,255,.9);opacity:0;transform-origin:0 0}
.card .tt{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:600;letter-spacing:.2px}
.card .dot{width:11px;height:11px;border-radius:50%;background:var(--tea);box-shadow:0 0 0 0 rgba(242,138,42,.5)}
.card .sub{font-size:15px;font-weight:300;color:#3d4a66;margin:4px 0 14px}
.st{display:grid;grid-template-columns:1fr auto;align-items:baseline;padding:9px 0;border-top:1px solid rgba(20,33,61,.09)}
.st span{font-size:15.5px;font-weight:400;color:#2d3a58}.st b{font-size:31px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blue);display:inline-block;transform-origin:100% 70%}
.st small{grid-column:1/-1;font-size:13px;font-weight:300;color:#56627c;margin-top:1px}
.st.o b{color:var(--tea)}.st.t b{color:var(--teal)}
.foot{position:absolute;right:44px;bottom:38px;text-align:right;font-size:15px;font-weight:300;color:#3d4a66;opacity:0}
.foot b{font-weight:500;color:var(--ink);font-size:18px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<div class="card" id="card"><div class="tt"><i class="dot" id="dot"></i><span id="ttl"></span></div><div class="sub" id="sub"></div>
 <div class="st t"><span>วันจรที่ผ่านไป</span><b id="s1">0</b><small id="s1d"></small></div>
 <div class="st"><span>ฤกษ์ที่จันทร์เดินผ่าน</span><b id="s2">0</b><small id="s2d"></small></div>
 <div class="st o"><span>วันธงชัย · อธิบดี</span><b id="s3">0</b><small id="s3d"></small></div></div>
<div class="foot" id="foot"></div>
<script>window.SKYDATA=/*DATA*/null;</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const D=window.SKYDATA, DUR=10, W=1080, H=1080, BUILD=1.0;
// ── สุ่มแบบกำหนดเมล็ด (ใช้ครั้งเดียวตอนสร้างฉาก)
let seed=20261104; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const C={blue:0x2346c8,blue2:0x4f73e8,teal:0x14a3a8,teal2:0x6fd0cf,green:0x3aa564,green2:0x8fd19e,tea:0xf28a2a,white:0xf7f5f0,slab:0xefeae0,ink:0x1c2a4a,cream:0xfff3d6};
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(1); R.setSize(W,H,false); R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05; R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf4f1ea);
const cam=new THREE.PerspectiveCamera(28,1,0.5,300);
scene.add(new THREE.HemisphereLight(0xfdfbf5,0xc9c3b4,1.35));
const sun=new THREE.DirectionalLight(0xffffff,2.3); sun.position.set(14,26,10); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.radius=6; sun.shadow.bias=-0.0004;
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:70}); scene.add(sun);
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.62,metalness:o.m??0.02,emissive:o.e??0x000000,emissiveIntensity:o.ei??0});
const RB=(w,h,d,r)=>new RoundedBoxGeometry(w,h,d,4,Math.min(r??0.12,Math.min(w,h,d)/2-0.001));
const parts=[]; // ทุกชิ้นที่ "สร้างตัวเอง": {o, base, delay}
function block(w,h,d,c,x,y,z,r,o){ const m=new THREE.Mesh(RB(w,h,d,r),typeof c==='number'?mat(c,o):c); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m; }
function addPart(o,parent,delay){ (parent||scene).add(o); parts.push({o,base:o.position.clone(),sc:o.scale.clone(),delay:delay??rnd()*0.55}); return o; }
const ang=lon=>-(lon-D.lagN*30-15)*Math.PI/180+Math.PI/2; // ลัคนากำเนิดหันเข้าหากล้องตอนเริ่ม
const P=(lon,r,y)=>new THREE.Vector3(Math.cos(ang(lon))*r,y,Math.sin(ang(lon))*r);
// ── พื้นลอย
const slab=addPart(block(21,1.1,21,C.slab,0,-0.55,0,0.5,{r:.85}),null,0); const slab2=addPart(block(19.4,0.18,19.4,0xf8f6f1,0,0.09,0,0.08,{r:.9}),null,0.05);
// ── วงจักรราศี ๑๒ ช่อง (สีตามธาตุ) · ลัคนากำเนิดสีชาไทย
const ELC=[C.blue,C.green,C.teal,C.blue2];
for(let s=0;s<12;s++){ const isL=s===D.lagN, h=isL?1.25:0.5+(D.cnt[s]||0)*0.22, g=new THREE.Group(); g.position.copy(P(s*30+15,7.6,0)); g.rotation.y=-ang(s*30+15);
  g.add(block(1.75,h,3.55,isL?C.tea:ELC[s%4],0,h/2+0.18,0,0.2,{r:.5})); g.add(block(0.5,0.12,3.2,0xffffff,-0.95,0.24,0,0.05)); addPart(g,null,0.15+s*0.03); }
// ── เส้นรอบนักษัตร ๒๗ (ก้อนเล็ก)
const nkB=[]; for(let i=0;i<27;i++){ const lon=i*360/27+360/54, m=block(0.62,0.34,0.62,(i%9)%2?C.teal2:C.green2,0,0,0,0.12); m.position.copy(P(lon,10,0.35)); nkB.push(m); addPart(m,null,0.35+i*0.012); }
// ── ทักษา ๘ ทิศ: เสาไฟมุมแท่น
D.tk.forEach((t,i)=>{ const a=i*Math.PI/4, g=new THREE.Group(); g.position.set(Math.sin(a)*13,0,-Math.cos(a)*13).multiplyScalar(0.72); const col=t==='g'?C.green:t==='b'?C.ink:C.teal;
  g.add(block(0.32,2.6,0.32,0xdfd9cc,0,1.3,0,0.1)); g.add(block(0.95,0.5,0.95,col,0,2.85,0,0.22,{e:col,ei:t==='g'?.35:.12})); addPart(g,null,0.5+i*0.04); });
// ── "เรา" ตรงกลาง + แท่นวงดาวเดิม
const me=new THREE.Group(); me.add(block(1.2,1.6,1.0,C.blue,0,1.0,0,0.45)); me.add(block(0.95,0.95,0.95,C.cream,0,2.35,0,0.46)); me.add(block(3.4,0.25,3.4,0xffffff,0,0.3,0,0.12)); addPart(me,null,0.25);
// ดาวเดิม: เม็ดแบนบนวงใน
const natM={}; Object.entries(D.nat).forEach(([k,lon],i)=>{ const m=block(0.78,0.22,0.78,k==='LA'?C.tea:0xffffff,0,0,0,0.11,{r:.4}); m.position.copy(P(lon,5.2,0.42)); natM[k]=m; addPart(m,null,0.4+i*0.03); });
const ringIn=new THREE.Mesh(new THREE.CylinderGeometry(6.15,6.15,0.12,96),mat(0xe9e3d7,{r:.8})); ringIn.position.y=0.25; ringIn.receiveShadow=true; addPart(ringIn,null,0.2);
// ── ดาวจร: ก้อนมนเกือบกลม ลอยเหนือวง
const PCOL={SU:[C.cream,0xffc76a,.55],MO:[0xffffff,0xffffff,.25],MA:[C.blue2,0,0],ME:[C.green,0,0],JU:[C.teal,0,0],VE:[C.teal2,0,0],SA:[C.blue,0,0],RA:[C.ink,0,0],KE:[0x8a93a8,0,0],UR:[C.green2,0,0]};
const PSZ={SU:1.35,MO:1.05,MA:.72,ME:.66,JU:1.0,VE:.82,SA:.95,RA:.75,KE:.62,UR:.6};
const PY={SU:4.2,MO:3.4,MA:2.7,ME:3.0,JU:3.9,VE:2.9,SA:3.6,RA:2.3,KE:2.1,UR:2.5};
const plan={}; Object.keys(D.s[0].p).forEach((k,i)=>{ const [c,e,ei]=PCOL[k]||[0xffffff,0,0], s=PSZ[k]||.7, g=new THREE.Group(); const m=block(s,s,s,c,0,0,0,s*0.49,{e,ei,r:.35}); g.add(m);
  if(k==='SA'){ const rg=new THREE.Mesh(new THREE.TorusGeometry(s*0.95,0.07,10,48),mat(0xb8c6f2,{r:.4})); rg.rotation.x=1.25; rg.castShadow=true; g.add(rg); }
  const st=block(0.07,1,0.07,0xd8d2c4,0,0,0,0.03); st.position.y=0; g.add(st); g.userData={k,st,m}; plan[k]=g; addPart(g,null,0.55+i*0.04); });
// ── ลำแสงกุม (ดาวจรใกล้ดาวเดิม)
const beams=Object.keys(D.nat).map(()=>{ const b=block(0.14,1,0.14,C.tea,0,0,0,0.06,{e:C.tea,ei:.6}); b.castShadow=false; b.visible=false; scene.add(b); return b; });
// ── ฝุ่นดาว (เคลื่อนไหวเล็ก ๆ)
const dust=[]; for(let i=0;i<46;i++){ const s=0.12+rnd()*0.16, m=block(s,s,s,[C.teal2,C.green2,0xffffff,C.blue2][i%4],0,0,0,s*0.45); const a=rnd()*Math.PI*2, r=3+rnd()*8.5; m.userData={a,r,y:4.5+rnd()*3.5,ph:rnd()*6.28,sp:0.15+rnd()*0.35}; m.castShadow=false; dust.push(m); addPart(m,null,0.6+rnd()*0.35); }
// ── โพสต์โปรเซส: GTAO + Output (ACES)
const comp=new EffectComposer(R); comp.setPixelRatio(1); comp.setSize(W,H); comp.addPass(new RenderPass(scene,cam));
const ao=new GTAOPass(scene,cam,W,H); ao.blendIntensity=0.9; ao.updateGtaoMaterial({radius:0.9,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:16}); ao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:6,rings:2,samples:16}); comp.addPass(ao); comp.addPass(new OutputPass());
// ── ตัวช่วยเวลา
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, back=x=>{ const c1=1.9,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const N=D.s.length-1, dayAt=t=>cl((t-1.15)/(DUR-1.35),0,1)*N; // ช่วงวันจรที่ไหลผ่านในคลิป
const lerpA=(a,b,f)=>{ let d=((b-a)%360+540)%360-180; return a+d*f; };
const posAt=(k,d)=>{ const i=Math.min(N-1,Math.floor(d)), f=d-i; return lerpA(D.s[i].p[k],D.s[i+1].p[k],f); };
const nf=n=>Math.floor(n).toLocaleString('th-TH');
const card=document.getElementById('card'), foot=document.getElementById('foot');
document.getElementById('ttl').textContent=D.title; document.getElementById('sub').textContent=D.sub;
function cum(d,f){ let n=0; for(let i=0;i<=Math.min(N,Math.floor(d));i++) n+=f(i); return n; }
// ── วาดหนึ่งเฟรมจากเวลา t เพียงค่าเดียว
function seek(t){ t=cl(t,0,DUR);
  const d=dayAt(t), live=cl((t-BUILD)/0.4,0,1);
  // ตำแหน่งดาวจรตามวันจร (ตั้งเป็นฐานก่อนคำนวณการเด้ง)
  for(const [k,g] of Object.entries(plan)){ const lon=posAt(k,d), y=PY[k]+Math.sin(t*1.6+lon*.05)*0.12; g.userData.y=y; parts.find(q=>q.o===g).base.copy(P(lon,5.2,y)); }
  // สร้างฉาก: ชิ้นส่วนลอยขึ้นและเด้งเกินเล็กน้อยในวินาทีแรก
  for(const p of parts){ const u=cl((t-p.delay*0.62)/0.38,0,1), b=u<=0?0:back(u); p.o.visible=u>0; p.o.position.set(p.base.x,p.base.y-(1-cl(u*1.25,0,1))*3.2,p.base.z); p.o.scale.set(p.sc.x*Math.max(0.001,b),p.sc.y*Math.max(0.001,b),p.sc.z*Math.max(0.001,b)); }
  for(const [k,g] of Object.entries(plan)){ const y=g.userData.y; g.userData.st.scale.y=Math.max(0.01,y-0.5); g.userData.st.position.y=-(y-0.5)/2; g.userData.m.rotation.y=t*(k==='MO'?1.4:0.7); }
  // นักษัตรที่จันทร์อยู่: ยกสูงและเป็นสีชาไทย
  const moN=Math.floor(((posAt('MO',d)%360)+360)%360/(360/27));
  nkB.forEach((m,i)=>{ const on=i===moN&&live>0; m.material.color.setHex(on?C.tea:(i%9)%2?C.teal2:C.green2); if(on){ m.scale.y*=1.8+0.25*Math.sin(t*6); } });
  // ลำแสงเมื่อดาวจรกุมดาวเดิม
  const nk=Object.keys(D.nat); beams.forEach(b=>b.visible=false); let bi=0;
  if(live>0) for(const [k,g] of Object.entries(plan)){ if(k==='MO') continue; for(let j=0;j<nk.length&&bi<beams.length;j++){ const dd=Math.abs(((posAt(k,d)-D.nat[nk[j]])%360+540)%360-180); if(dd<5){ const b=beams[bi++], a=natM[nk[j]].position, top=g.position; const L=Math.max(0.1,top.y-a.y-0.4); b.visible=true; b.position.set(a.x,a.y+L/2+0.1,a.z); b.scale.set(1+0.35*Math.sin(t*7+j),L,1+0.35*Math.sin(t*7+j)); b.material.emissiveIntensity=(0.4+0.35*Math.sin(t*5+j))*live*(1-dd/5); } } }
  dust.forEach(m=>{ const u=m.userData, a=u.a+t*u.sp; m.position.x=Math.cos(a)*u.r; m.position.z=Math.sin(a)*u.r; m.position.y=(m.visible?u.y+Math.sin(t*1.3+u.ph)*0.35:m.position.y); m.rotation.set(t*u.sp,t*u.sp*1.3,0); });
  me.rotation.y=Math.sin(t*0.9)*0.25;
  // กล้อง: โคจรช้า + ดันเข้า
  const e=ease(t/DUR), th=0.62+e*0.95, rr=54-e*7, hy=31-e*4; cam.position.set(Math.sin(th)*rr,hy,Math.cos(th)*rr); cam.lookAt(0,1.2,0); cam.setViewOffset(W,H,-70,-46,W,H); cam.updateMatrixWorld();
  // การ์ดกระจกฝ้า + ตัวเลขที่นับขึ้น
  const ci=cl((t-1.0)/0.45,0,1), cb=ci<=0?0:back(ci); card.style.opacity=String(ci); card.style.transform=`translateY(${(1-ci)*-18}px) scale(${0.94+0.06*cb})`;
  foot.style.opacity=String(cl((t-1.3)/0.5,0,1)); const si=D.s[Math.min(N,Math.round(d))];
  foot.innerHTML=`<b>${si.dt}</b><br>จันทร์ฤกษ์ ${si.nk} · ${si.kham}`;
  const dot=document.getElementById('dot'), pz=(t*1.2)%1; dot.style.boxShadow=`0 0 0 ${pz*12}px rgba(242,138,42,${0.5*(1-pz)})`;
  const tick=(id,v,prev,dsc)=>{ const el=document.getElementById(id); el.textContent=nf(v); const fr=d-Math.floor(d); const pop=v>prev?Math.max(0,1-fr*3):0; el.style.transform=`scale(${1+0.16*pop})`; document.getElementById(id+'d').textContent=dsc; };
  const d0=Math.floor(d), g1=k=>cum(k,i=>i>0&&D.s[i].mk!==D.s[i-1].mk?1:0), g3=k=>cum(k,i=>D.s[i].good?1:0);
  tick('s1',d0,d0-1,`${D.s[0].dt} → ${si.dt}`); tick('s2',g1(d),g1(d-1),`ตอนนี้ ฤกษ์${si.nk}`); tick('s3',g3(d),g3(d-1),si.good?`วันนี้เป็น${si.good}`:'นับวันดีตามกาลโยคประจำปี');
  comp.render(); }
window.__seek=t=>{ window.__auto=false; seek(t); return true; };
window.__ready=true; window.__auto=true;
// เล่นอัตโนมัติ: นับเฟรม (ไม่ใช้นาฬิกาจริงคำนวณภาพ)
let fr=0; const tickF=()=>{ if(!window.__auto) return; seek(fr/60); fr++; if(fr<=DUR*60) requestAnimationFrame(tickF); }; requestAnimationFrame(tickF);
</script>
</body>
</html>
